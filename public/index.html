<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gut Check</title>
<meta name="description" content="A decision journal and prediction tracker that checks back later, scores your judgment and calibration, and can play devil's advocate.">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#today" aria-label="Gut Check home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M9 16.5l4.5 4.5L23 11" stroke="var(--on-accent)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Gut Check</span>

<main id="view" tabindex="-1"></main>

  <a href="#new" data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New</span></a>
  <a href="#journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg><span>Journal</span></a>

</nav>

<dialog id="modal"><div id="modalBody"></div></dialog>

<script src="lib/core.js"></script>

<script src="skins/tribunal.js"></script>
<script src="skins/mentor.js"></script>
