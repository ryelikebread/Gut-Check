# Gut Check without a local AI model: sync, backups and reminders only.
# The devil's advocate still works using its built-in (offline) version.
#   docker compose -f docker-compose.no-ai.yml up -d --build
services:
  gut-check:
    build: .
    image: gut-check
    container_name: gut-check
    restart: unless-stopped
    ports:
      - "${PORT:-8801}:8801"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8801"            # inside the container; set PORT in .env to change the host port
      OLLAMA_URL: ""
      TZ: ${TZ:-UTC}
    volumes:
      - gut-check-data:/data
volumes:
  gut-check-data:
