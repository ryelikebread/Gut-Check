# Use an NVIDIA GPU for the devil's advocate model (much faster).
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host. Then:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
